name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create tweak files
        run: |
          cat > Makefile <<'EOF_Makefile'
          TARGET := iphone:clang:latest:14.0
          ARCHS = arm64

          include $(THEOS)/makefiles/common.mk

          TWEAK_NAME = TTLogger
          TTLogger_FILES = TTFpsLogger.m
          TTLogger_CFLAGS = -fobjc-arc
          TTLogger_FRAMEWORKS = UIKit Foundation

          include $(THEOS_MAKE_PATH)/tweak.mk
          EOF_Makefile
          cat > control <<'EOF_control'
          Package: com.user.ttlogger
          Name: TTLogger
          Version: 1.0
          Architecture: iphoneos-arm
          Description: TikTok force 60 fps
          Maintainer: user
          Author: user
          Section: Tweaks
          EOF_control
          cat > TTFpsLogger.m <<'EOF_Tweak_m'
          // TTFpsLogger.m - финальная версия.
          // Убирает из списка вариантов видео 30-fps копии, если среди них есть 60-fps.
          // Без логов, без кнопок, без записи файлов.

          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #import <objc/runtime.h>
          #import <objc/message.h>
          #include <string.h>

          static const long long kHighFps = 50;
          static NSMutableSet<NSString *> *gHooked;

          static long long ModelFps(id m) {
              SEL s = sel_registerName("fps");
              if (!m || ![m respondsToSelector:s]) return -1;
              return ((long long (*)(id, SEL))objc_msgSend)(m, s);
          }

          static NSArray *FilterModels(id owner, NSArray *arr, const void *key) {
              if (![arr isKindOfClass:NSArray.class] || arr.count < 2) return arr;
              NSArray *cache = objc_getAssociatedObject(owner, key);
              if (cache.count == 2 && cache[0] == arr) return cache[1];

              BOOL hasHigh = NO;
              for (id m in arr) if (ModelFps(m) >= kHighFps) { hasHigh = YES; break; }

              NSArray *result = arr;
              if (hasHigh) {
                  NSMutableArray *keep = [NSMutableArray array];
                  for (id m in arr) {
                      long long f = ModelFps(m);
                      if (f <= 0 || f >= kHighFps) [keep addObject:m]; // fps неизвестен -> не трогаем
                  }
                  if (keep.count > 0 && keep.count < arr.count) result = [keep copy];
              }
              objc_setAssociatedObject(owner, key, @[arr, result], OBJC_ASSOCIATION_RETAIN_NONATOMIC);
              return result;
          }

          static void HookModelsGetter(const char *cname, const char *sname) {
              NSString *hk = [NSString stringWithFormat:@"%s %s", cname, sname];
              if ([gHooked containsObject:hk]) return;
              Class cls = objc_getClass(cname);
              if (!cls) return;
              SEL sel = sel_registerName(sname);
              Method m = class_getInstanceMethod(cls, sel);
              if (!m) { [gHooked addObject:hk]; return; }
              char ret[64];
              method_getReturnType(m, ret, sizeof ret);
              if (ret[0] != '@' || method_getNumberOfArguments(m) != 2) { [gHooked addObject:hk]; return; }
              const char *key = strdup(sname);
              IMP orig = method_getImplementation(m);
              IMP imp = imp_implementationWithBlock(^id(id self_) {
                  id r = ((id (*)(id, SEL))orig)(self_, sel);
                  return FilterModels(self_, r, key);
              });
              class_replaceMethod(cls, sel, imp, method_getTypeEncoding(m));
              [gHooked addObject:hk];
          }

          static void InstallHooks(void) {
              if (!gHooked) gHooked = [NSMutableSet set];
              HookModelsGetter("AWEVideoModel", "bitrateModels");
              HookModelsGetter("AWEVideoModel", "SDRBitrateModels");
              HookModelsGetter("AWEVideoModel", "HDRBitrateModels");
          }

          __attribute__((constructor))
          static void TTFpsInit(void) {
              InstallHooks();
              // Часть классов подгружается лениво - повторяем попытки.
              for (int i = 1; i <= 10; i++) {
                  dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(i * 3 * NSEC_PER_SEC)),
                                 dispatch_get_main_queue(), ^{ InstallHooks(); });
              }
              [[NSNotificationCenter defaultCenter] addObserverForName:UIApplicationDidBecomeActiveNotification
                                                                object:nil queue:NSOperationQueue.mainQueue
                                                            usingBlock:^(NSNotification *n) { InstallHooks(); }];
          }

          EOF_Tweak_m
          echo '{ Filter = { Bundles = ( "com.apple.UIKit" ); }; }' > TTLogger.plist

      - name: Install tools
        run: |
          brew install make ldid
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

      - name: Install Theos
        run: |
          git clone --recursive --depth=1 https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build
        run: make FINALPACKAGE=1

      - name: Collect dylib
        run: |
          mkdir -p out
          find .theos -name "*.dylib" -exec cp {} out/ \;
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: dylib
          path: out/
